services:
  - type: web
    name: arc-agent-economy
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --ignore-scripts
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: REGISTRY_CA
        value: 0x9C2e68251E91dD9724feD8E6D270bC7542273d0C
      - key: ESCROW_CA
        value: 0xDF5455170BCE05D961c8643180f22361C0340DE0
      - key: CIRCLE_API_KEY
        sync: false
      - key: CIRCLE_ENTITY_SECRET
        sync: false
      - key: WALLET_SET_ID
        sync: false
      - key: MASTER_WALLET_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: HUB_ADMIN_SECRET
        sync: false
